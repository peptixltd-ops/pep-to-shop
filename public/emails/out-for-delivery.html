<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Out for delivery · Pondok Peptides</title></head>
<body style="margin:0;padding:0;background:#E7F4F9;font-family:'Inter',Helvetica,Arial,sans-serif;color:#061D2B;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E7F4F9;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border:1px solid #DAE3E6;">
        <tr><td style="padding:28px 32px;border-bottom:1px solid #DAE3E6;text-align:center;">
          <img src="https://pondokpeptides.com/press/pondok-wordmark.png" alt="Pondok Peptides" height="28" style="height:28px;">
        </td></tr>
        <tr><td style="padding:40px 32px 8px;text-align:center;">
          <p style="margin:0 0 8px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#486748;font-family:'Courier New',monospace;">Out for delivery</p>
          <h1 style="margin:0;font-family:'Syne','Inter',sans-serif;font-size:32px;line-height:1.15;letter-spacing:-.02em;">Arriving today.</h1>
          <p style="margin:16px auto 0;max-width:440px;font-size:15px;line-height:1.6;color:#59656E;">Order {{ name }} is on the van. Keep an eye out, the courier will deliver it later today.</p>
        </td></tr>
        <tr><td style="padding:24px 32px 32px;text-align:center;">
          {% if fulfillment.tracking_numbers.size > 0 %}
          <p style="margin:0 0 6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#59656E;">Tracking</p>
          <p style="margin:0 0 20px;font-family:'Courier New',monospace;font-size:14px;color:#061D2B;">{{ fulfillment.tracking_numbers.first }}</p>
          {% endif %}
          <a href="{{ fulfillment.tracking_url | default: order_status_url }}" style="display:inline-block;background:#486748;color:#FFFFFF;text-decoration:none;padding:14px 32px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;">Track shipment</a>
        </td></tr>
        <tr><td style="padding:18px 32px;background:#E7F4F9;text-align:center;">
          <p style="margin:0;font-size:11px;color:#59656E;">For research use only · <a href="https://pondokpeptides.com" style="color:#486748;text-decoration:none;">pondokpeptides.com</a></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
